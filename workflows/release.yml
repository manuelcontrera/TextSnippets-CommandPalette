name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.version }}' -ne '') {
            $raw = '${{ inputs.version }}'
          } else {
            $raw = '${{ github.ref_name }}'
          }
          $ver = $raw -replace '^v', ''
          if ($ver -notmatch '^\d+(\.\d+){1,3}$') {
            $ver = '1.0.1'
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Version is $ver"

      - name: Update Version in Manifests and Project
        shell: pwsh
        run: |
          $ver = "$env:VERSION.0"
          $manifest = "src/SnippetsCmdPal/Package.appxmanifest"
          $content = Get-Content $manifest -Raw
          $content = $content -replace 'Version="[0-9\.]+"', "Version=""$ver"""
          Set-Content -Path $manifest -Value $content

          $csproj = "src/SnippetsCmdPal/SnippetsCmdPal.csproj"
          $csContent = Get-Content $csproj -Raw
          $csContent = $csContent -replace '<AppxPackageVersion>[0-9\.]+</AppxPackageVersion>', "<AppxPackageVersion>$ver</AppxPackageVersion>"
          Set-Content -Path $csproj -Value $csContent

      - name: Compile SnippetEditorApp (WinUI 3)
        run: dotnet build src/SnippetEditorApp/SnippetEditorApp.csproj -c Release -r win-x64

      - name: Compile SnippetsCmdPal (Command Palette Extension)
        run: dotnet build src/SnippetsCmdPal/SnippetsCmdPal.csproj -c Release -r win-x64

      - name: Bundle Package Payload
        shell: pwsh
        run: |
          $TargetDir = "src/SnippetsCmdPal/bin/Release/net10.0-windows10.0.26100.0/win-x64"
          $EditorBin = "src/SnippetEditorApp/bin/Release/net10.0-windows10.0.26100.0"
          $AssetsSrc = "src/SnippetsCmdPal/Assets"

          New-Item -ItemType Directory -Path "$TargetDir/SnippetEditorApp" -Force | Out-Null
          Copy-Item -Path "$EditorBin/*" -Destination "$TargetDir/SnippetEditorApp/" -Recurse -Force
          Copy-Item -Path "$EditorBin/SnippetEditorApp.*" -Destination "$TargetDir/" -Force
          Copy-Item -Path "$AssetsSrc/*" -Destination "$TargetDir/Assets/" -Recurse -Force
          Copy-Item -Path "$AssetsSrc/*" -Destination "$TargetDir/SnippetEditorApp/Assets/" -Recurse -Force

      - name: Package and Sign MSIX
        shell: pwsh
        run: |
          $MakeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $SignTool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $TargetDir = "src/SnippetsCmdPal/bin/Release/net10.0-windows10.0.26100.0/win-x64"
          
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $MsixName = "TextSnippets-CommandPalette-$env:VERSION.0-x64.msix"
          $OutputMsix = "dist/$MsixName"

          & $MakeAppx pack /d "$TargetDir" /p "$OutputMsix" /o

          # Signing
          $CertSubject = "CN=SnippetsCmdPalPublisher"
          $PfxPath = "dist/cert.pfx"
          $CerPath = "dist/TextSnippets.cer"

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $CertSubject -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $password = ConvertTo-SecureString -String "snippets123!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $PfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $CerPath | Out-Null

          & $SignTool sign /fd SHA256 /a /f "$PfxPath" /p "snippets123!" "$OutputMsix"

          # Portable Zip
          $ZipName = "TextSnippets-CommandPalette-$env:VERSION.0-x64.zip"
          Compress-Archive -Path "$TargetDir/*" -DestinationPath "dist/$ZipName" -Force

          # Hashes
          $msixHash = (Get-FileHash -Path "$OutputMsix" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path "dist/$ZipName" -Algorithm SHA256).Hash

          @"
          $msixHash  $MsixName
          $zipHash  $ZipName
          "@ | Set-Content -Path "dist/SHA256SUMS.txt"

          Remove-Item "$PfxPath" -Force -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Text Snippets v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.msix
            dist/*.zip
            dist/*.cer
            dist/SHA256SUMS.txt
